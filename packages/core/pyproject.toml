[project]
name = "ancient-text-lab"
version = "0.1.0"
description = "Reusable corpus, provenance, and sequence-analysis primitives for ancient-text research"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alexander Katin" }]
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ancient_text_lab"]

