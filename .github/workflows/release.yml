name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv build --package ancient-text-lab
      - uses: actions/upload-artifact@v4
        with:
          name: ancient-text-lab-dist
          path: dist/
